# File: ops/compose.prod.yaml
#
# Summary:
# 本番環境（プロダクション）向けにDocker Composeの設定を上書き・最適化するファイル。
# セキュリティ向上のためデータベースのポート公開を閉じ（内部通信のみに制限）、バックエンドコンテナのソースコードマウントを解除してイメージに焼き込まれたコードを使用するように変更します。また、NginxにHTTPS通信用の443番ポートを開放するなど、本番運用に適した安全な設定を提供します。
#
# Tags: Docker, Compose, Production, Security, Override

services:
  db:
    restart: always
    # 本番ではポートを公開しない（コンテナ間通信のみ）
    ports: [] 

  backend:
    restart: always
    volumes:
      # ソースコードのマウントを外す（イメージ内のコードを使う）
      - ./logs/app:/var/log/app
    # リロードなしで起動
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    # 本番ではビルド済みの静的ファイルだけをNginxで配信するのが一般的ですが、
    # 簡易構成としてNodeサーバーで動かす場合の設定
    restart: always
    command: npm run preview -- --host

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443" # SSL対応用