# File: compose.yaml
#
# Summary:
# プロジェクト全体のコンテナ構成を定義する、Docker Composeのベースファイル。
# データベース（PostgreSQL + pgvector）、バックエンド（FastAPI）、フロントエンド（React/Vite）、およびリバースプロキシ（Nginx）の4つの主要サービスについて、ベースとなるイメージ、ネットワーク連携、ボリューム、ヘルスチェックなどの基本設定を記述し、システム全体の土台を提供します。
#
# Tags: Docker, Compose, Infrastructure, Services, Network

name: rehab-plan-generator # プロジェクト名（コンテナ名の接頭辞になります）

services: # ここに起動するサーバー群を定義します
  # ----------------------------------------------------------------
  # 🐘 Database: PostgreSQL + pgvector
  # ----------------------------------------------------------------
  # 医療データの中間DBおよびベクトル検索エンジンとして機能します。
  db:
    image: pgvector/pgvector:pg16 # 拡張機能(pgvector)が入ったバージョン
    container_name: rpg-db
    restart: always
    # ポート公開(ports)は削除し、内部ネットワークのみとする
    environment:
      POSTGRES_USER: ${DB_USER}     # .envから読み込み
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Tokyo
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d # 初期化SQL (pgvector有効化)
    networks:
      - rpg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # 🐍 Backend: Python (FastAPI)
  # ----------------------------------------------------------------
  # APIサーバーおよびビジネスロジックを実行します。
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rpg-backend
    restart: always
    # portsとvolumes(ソースコード同期)を削除
    volumes:
      - ./logs/app:/var/log/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      ENV: ${ENV}
    depends_on:
      db:
        condition: service_healthy
    # 本番用コマンド: リロードなし
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - rpg-network

  # ----------------------------------------------------------------
  # ⚛️ Frontend: React + TypeScript (Vite)
  # ----------------------------------------------------------------
  # UIを提供します。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rpg-frontend
    restart: always
    # portsを削除
    environment:
      - NODE_ENV=production
    # 本番用コマンド (Viteのpreview機能など)
    command: npm run preview -- --host
    networks:
      - rpg-network

  # ----------------------------------------------------------------
  # 🌐 Nginx: Reverse Proxy
  # ----------------------------------------------------------------
  # 唯一外部(ホスト)と通信するゲートウェイ
  nginx:
    image: nginx:alpine
    container_name: rpg-nginx
    ports:
      - "80:80"
      # 本番でSSL化する場合はここに "443:443" を追加
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./frontend/public/libs:/usr/share/nginx/html/libs # オフライン用ライブラリ配信
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - rpg-network

volumes: # データの保存場所定義
  db_data: # DBデータの永続化

networks: # コンテナ同士の通信網定義
  rpg-network:
    driver: bridge