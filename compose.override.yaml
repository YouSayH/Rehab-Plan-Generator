# File: compose.override.yaml
#
# Summary:
# 開発環境（ローカル）向けに `compose.yaml` の設定を上書き（拡張）するファイル。
# ホストマシンからのポートアクセスを `127.0.0.1` に限定してローカル環境のセキュリティを高めるほか、ホストのソースコードをコンテナ内に同期させるボリュームマウント設定や、ホットリロード機能、開発用の環境変数を追加し、快適な開発体験（DX）を提供します。
#
# Tags: Docker, Compose, Development, Override, Hot-Reload

services:
  # ----------------------------------------------------------------
  # 🐘 Database (Dev Override)
  # ----------------------------------------------------------------
  db:
    ports:
      # 127.0.0.1 を指定して、外部LANからの接続を遮断
      - "127.0.0.1:5432:5432"

  # ----------------------------------------------------------------
  # 🐍 Backend (Dev Override)
  # ----------------------------------------------------------------
  backend:
    ports:
      # Swagger UI等も自分だけが見れるように制限
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    environment:
      ENV: dev
      LOG_LEVEL: debug
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ----------------------------------------------------------------
  # ⚛️ Frontend (Dev Override)
  # ----------------------------------------------------------------
  frontend:
    ports:
      # フロントエンド開発サーバーも自分のみ
      - "127.0.0.1:3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    command: npm run dev -- --host

  # ----------------------------------------------------------------
  # 🌐 Nginx (Dev Override)
  # ----------------------------------------------------------------
  # ベース(compose.yaml)で開けている80番ポートも、
  # 開発時は自分専用にするためにオーバーライドします。
  nginx:
      ports:
        - "127.0.0.1:8080:80"